<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقدمة في التجارة الإلكترونية</title>
<!-- خط عربي واضح (إذا لم يتوفر الإنترنت يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والهوية البصرية
   ========================================================= */
:root{
  --p:#6D3FD1;        /* البنفسجي الأساسي */
  --p2:#8B5CF6;       /* بنفسجي فاتح */
  --pd:#46288F;       /* بنفسجي غامق للعناوين */
  --lav:#EFE7FF;      /* لافندر */
  --lav2:#F8F4FF;
  --line:#E3D8FB;
  --mint:#12A05C;     /* الأخضر */
  --mintbg:#E0F6EA;
  --yel:#FFD43B;      /* الأصفر */
  --yelbg:#FFF7D6;
  --yelline:#F5DE85;
  --coral:#F25F5C;
  --coralbg:#FFECEB;
  --amber:#F2B705;
  --ink:#2A2140;
  --muted:#6F6888;
  --shadow:0 14px 40px -18px rgba(76,40,160,.35);
  --font:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#E9E1FB;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::-webkit-scrollbar{display:none}

/* =========================================================
   2) المسرح: 1600×900 (16:9) يتم تكبيره ليملأ الشاشة دون تمرير
   ========================================================= */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{
  position:relative;flex:none;width:1600px;height:900px;overflow:hidden;
  background:
    radial-gradient(900px 520px at 105% -10%, #E4D7FF 0, transparent 60%),
    radial-gradient(700px 460px at -6% -12%, #FFF3BF 0, transparent 60%),
    radial-gradient(760px 520px at -8% 110%, #D3F2E1 0, transparent 60%),
    linear-gradient(180deg,#FCFAFF,#F4EEFF);
}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(109,63,209,.13) 1.6px,transparent 1.7px);background-size:30px 30px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 45%);mask-image:linear-gradient(180deg,#000,transparent 45%)}
.deco{position:absolute;font-size:130px;opacity:.06;pointer-events:none}

/* ---------- ربط بالدين: الآية ---------- */
.ayah{display:flex;align-items:center;gap:24px;background:linear-gradient(135deg,#fff,var(--mintbg));border:3px solid var(--mint);border-radius:28px;padding:16px 32px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
.ayah::after{content:'';position:absolute;inset:7px;border:2px dashed rgba(18,160,92,.35);border-radius:22px;pointer-events:none}
.ay-ico{flex:none;width:84px;height:84px;border-radius:24px;background:var(--yelbg);display:grid;place-items:center;font-size:46px}
.ay-text{font-family:'Amiri','Traditional Arabic','Times New Roman',serif;font-size:38px;font-weight:700;color:#0B5E38;line-height:1.75}
.ay-src{display:inline-block;margin-top:2px;font-size:20px;color:var(--pd);font-weight:800;background:var(--yelbg);padding:2px 14px;border-radius:999px}
.ay-text.plain{font-family:var(--font);font-size:34px;font-weight:800;color:var(--pd);line-height:1.6}
.hadith{font-family:'Amiri','Traditional Arabic',serif;font-size:26px;font-weight:700;color:#0B5E38;display:block;margin:4px 0}
.rc-detail small{display:block;font-size:18px;color:var(--muted);font-weight:700}

/* ---------- الشريط العلوي: الشعار + تتبع الطلب + النقاط ---------- */
.topbar{position:absolute;top:0;left:0;right:0;height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:5}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;font-size:24px;color:var(--pd)}
.brand .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--mint));display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow)}
.brand small{display:block;font-size:16px;color:var(--muted);font-weight:500}
.tracker{position:relative;width:640px;display:flex;justify-content:space-between}
.tracker::before{content:'';position:absolute;top:20px;right:60px;left:60px;height:6px;background:var(--line);border-radius:6px}
.tracker .fill{position:absolute;top:20px;right:60px;height:6px;width:0;background:linear-gradient(270deg,var(--p),var(--yel),var(--mint));border-radius:6px;transition:width .6s ease}
.tk{position:relative;z-index:1;width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:800;color:var(--muted)}
.tk i{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:21px;transition:.4s}
.tk.on{color:var(--pd)}
.tk.on i{background:var(--p);border-color:var(--p);box-shadow:0 0 0 6px rgba(109,63,209,.15)}
.tk.on:nth-of-type(3) i{background:var(--yel);border-color:var(--yel);box-shadow:0 0 0 6px rgba(255,212,59,.25)}
.tk.on:nth-of-type(4) i,.tk.on:nth-of-type(5) i{background:var(--mint);border-color:var(--mint);box-shadow:0 0 0 6px rgba(18,160,92,.18)}
.points{display:flex;align-items:center;gap:10px;background:var(--yelbg);border:2px solid var(--yelline);padding:7px 18px 7px 10px;border-radius:999px;font-weight:800;font-size:19px;color:var(--pd);box-shadow:var(--shadow)}
.points .bag{width:40px;height:40px;border-radius:50%;background:var(--mintbg);display:grid;place-items:center;font-size:22px}
.points b{font-size:26px;color:var(--mint);min-width:28px;text-align:center}

/* =========================================================
   3) الشرائح والانتقالات
   ========================================================= */
.slide{position:absolute;top:104px;bottom:80px;left:64px;right:64px;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto}
.slide.out{visibility:visible;animation:slideOut .38s ease both}
.slide.active.fx-fade{animation:inFade .6s ease both}
.slide.active.fx-slide-n{animation:inSlideN .65s cubic-bezier(.2,.8,.2,1) both}
.slide.active.fx-slide-p{animation:inSlideP .65s cubic-bezier(.2,.8,.2,1) both}
.slide.active.fx-zoom{animation:inZoom .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97)}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inSlideN{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes inSlideP{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@keyframes inZoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* ظهور العناصر بالتتابع */
.slide.play .rv{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes popIn{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes slideInR{from{opacity:0;transform:translateX(40px)}}

/* ---------- عناصر مشتركة ---------- */
.s-head{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.s-head h2{font-size:50px;font-weight:900;color:var(--pd);line-height:1.2}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--yelbg);border:2px solid var(--yelline);color:var(--pd);font-size:21px;font-weight:800;padding:8px 18px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.lead{font-size:29px;color:var(--muted);font-weight:600;line-height:1.55;margin-bottom:18px}
.lead b{color:var(--p)}
.note{background:#FFF7E6;border-right:6px solid var(--amber);border-radius:18px;padding:14px 24px;font-size:25px;font-weight:600;line-height:1.55;margin-top:18px}
.chat{display:inline-block;background:var(--mintbg);color:#0b7a58;font-weight:800;font-size:22px;padding:4px 14px;border-radius:999px;margin-inline-start:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-weight:800;padding:12px 24px;border-radius:16px;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 10px 22px -10px rgba(109,63,209,.8)}
.btn.ghost{background:var(--lav);color:var(--p)}
.btn.add{background:var(--mint);color:#fff;font-size:21px;padding:10px 18px;box-shadow:0 10px 20px -12px rgba(20,184,134,.9)}
.btn.big{font-size:30px;padding:16px 34px;border-radius:22px}
.btn.wide{width:100%}
.btn.sm{font-size:19px;padding:8px 14px;border-radius:12px}

/* ---------- صندوق السؤال ---------- */
.q-box{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#fff,var(--lav2));border:2px solid var(--line);border-radius:28px;padding:22px 30px;font-size:35px;font-weight:800;line-height:1.5;margin-bottom:22px;box-shadow:var(--shadow)}
.q-box.big{font-size:31px}
.q-ico{flex:none;width:84px;height:84px;border-radius:24px;background:var(--lav);display:grid;place-items:center;font-size:48px}
.q-hint{font-size:23px;color:var(--muted);margin:-8px 0 16px;text-align:center;font-weight:600}

/* ---------- أزرار الخيارات ---------- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;display:flex;align-items:center;gap:18px;padding:18px 28px 18px 76px;min-height:104px;font-size:33px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:var(--shadow);text-align:right;transition:transform .2s,border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p2)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default}
.o-ico{font-size:44px;flex:none}
.o-txt small{display:block;font-size:20px;color:var(--muted);font-weight:600}
.o-let{position:absolute;left:18px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:12px;background:var(--lav);color:var(--p);font-size:24px;font-weight:900;display:grid;place-items:center}
.opt.ok{background:var(--mintbg);border-color:var(--mint);color:#0b6e51}
.opt.ok .o-let{background:var(--mint);color:#fff}
.opt.no{background:var(--coralbg);border-color:var(--coral);opacity:.7}
.qgroup.solved .opt:not(.ok){opacity:.45}
.opt.sm{min-height:auto;padding:10px 18px;font-size:23px;border-radius:16px;box-shadow:none}
.fb{min-height:62px;font-size:36px;font-weight:900;text-align:center;margin-top:14px}
.fb.ok{color:var(--mint)}
.fb.no{color:var(--p)}
.explain{display:none;background:var(--lav2);border:2px dashed var(--line);border-radius:18px;padding:12px 22px;font-size:25px;font-weight:600;color:var(--pd);text-align:center;line-height:1.5}
.solved .explain{display:block;animation:rise .5s both}

/* ---------- البطاقات القابلة للقلب ---------- */
.flip-grid,.card-grid{display:grid;gap:22px;flex:1;min-height:0;grid-auto-rows:1fr}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.flip{perspective:1400px;cursor:pointer;min-height:0}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 26px;gap:10px}
.front{background:#fff;border:3px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s}
.flip:hover .front{border-color:var(--p2)}
.back{background:linear-gradient(145deg,var(--p) 0%,var(--pd) 70%,#0E7A47 130%);color:#fff;transform:rotateY(180deg)}
.f-ico{font-size:70px}
.f-title{font-size:35px;font-weight:900;color:var(--pd);line-height:1.3}
.f-title small{display:block;font-size:22px;color:var(--muted);font-weight:700}
.back .f-title{color:#fff;font-size:26px;opacity:.85}
.back p{font-size:27px;line-height:1.55;font-weight:600}
.f-ex{font-size:22px;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:12px;line-height:1.5}
.f-hint{font-size:18px;color:var(--muted);font-weight:700}

/* ---------- بطاقات الكشف ---------- */
.rcard,.sit{position:relative;background:#fff;border:3px solid var(--line);border-radius:26px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;box-shadow:var(--shadow);overflow:hidden}
.rcard{cursor:pointer;transition:transform .25s,border-color .25s,background .3s}
.rcard:hover{transform:translateY(-5px);border-color:var(--p2)}
.rc-ico{font-size:54px}
.rc-tag{font-size:17px;font-weight:800;background:var(--lav);color:var(--p);padding:3px 12px;border-radius:999px}
.rc-title{font-size:29px;font-weight:900;color:var(--pd);line-height:1.3}
.rc-detail{font-size:24px;line-height:1.5;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .5s}
.rc-detail b{color:var(--p)}
.rcard.open .rc-detail{max-height:220px;opacity:1}
.rc-tap{font-size:18px;color:var(--muted);font-weight:700}
.rcard.open .rc-tap{display:none}
.rcard.open{border-color:var(--mint);background:linear-gradient(180deg,#fff,var(--mintbg))}
.sit{font-size:27px;font-weight:700;line-height:1.5}
.c-foot{display:flex;gap:22px;align-items:center;margin-top:18px}
.c-foot .note{flex:1;margin:0}

/* ---------- صندوق الكشف ---------- */
.reveal-box{margin-top:20px;border-radius:26px;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--mint));color:#fff;padding:20px 32px;text-align:center;box-shadow:var(--shadow);transition:transform .2s;border:3px solid transparent}
.reveal-box:hover{transform:scale(1.01)}
.rb-label{font-size:31px;font-weight:900}
.rb-content{display:none;font-size:29px;line-height:1.6;font-weight:600}
.rb-content b{color:var(--p)}
.reveal-box.open{background:#fff;color:var(--ink);border-color:var(--p2)}
.reveal-box.open .rb-label{display:none}
.reveal-box.open .rb-content{display:block;animation:popIn .5s both}

/* ---------- الخطوات المتتابعة (تتبع الطلب) ---------- */
.steps-wrap{display:flex;gap:44px;flex:1;min-height:0}
.side{width:400px;flex:none;display:flex;align-items:center;justify-content:center}
.steps-col{flex:1;display:flex;flex-direction:column;min-height:0}
.track{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tstep{position:relative;display:flex;align-items:center;gap:18px;font-size:26px;font-weight:700;padding:6px 16px;border-radius:18px;border:2px dashed var(--line);color:transparent;background:rgba(255,255,255,.5);transition:.4s}
.t-ico{width:48px;height:48px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-size:24px;flex:none;filter:grayscale(1) opacity(.35);transition:.4s}
.tstep:not(.on)::after{content:'؟';position:absolute;right:86px;color:var(--line);font-weight:900;font-size:30px}
.tstep.on{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);animation:slideInR .5s both}
.tstep.on .t-ico{filter:none;background:var(--lav)}
.tstep.on:last-of-type .t-ico{background:var(--mintbg)}
.row-btns{display:flex;gap:12px}
.final{display:none;position:absolute;left:0;right:0;bottom:-8px;margin:0 auto;width:max-content;max-width:92%;background:linear-gradient(135deg,var(--p),var(--mint));color:#fff;font-size:32px;font-weight:900;padding:16px 40px;border-radius:999px;box-shadow:0 20px 40px -16px rgba(76,40,160,.7);z-index:3;text-align:center}
.final.show{display:block;animation:popIn .6s both}

/* جوال المتجر */
.phone{width:270px;height:480px;border-radius:44px;background:#1F1636;padding:13px;box-shadow:0 30px 50px -20px rgba(31,22,54,.6)}
.ph-screen{height:100%;border-radius:32px;background:linear-gradient(180deg,#fff,var(--lav));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px}
.ph-app{font-size:17px;font-weight:800;color:var(--muted)}
.ph-prod{font-size:110px;animation:bob 3s ease-in-out infinite}
.ph-name{font-size:26px;font-weight:900}
.ph-price{font-size:24px;color:var(--p);font-weight:900}
.ph-buy{background:var(--mint);color:#fff;font-weight:800;padding:10px 28px;border-radius:14px;font-size:21px;animation:pulse 2s ease-in-out infinite}
.side-card{background:#fff;border:3px solid var(--line);border-radius:28px;padding:30px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center}
.sc-ico{font-size:80px}
.side-card b{font-size:34px;color:var(--pd)}
.side-card p{font-size:23px;line-height:1.6;color:var(--muted);font-weight:600}
.sc-link{direction:ltr;font-weight:800;color:var(--p);background:var(--lav);padding:6px 16px;border-radius:12px;font-size:21px}

/* ---------- العصف الذهني ---------- */
.bs{display:flex;flex-direction:column;flex:1;min-height:0}
.bs-top{display:flex;gap:26px;align-items:center}
.bs-top .q-box{flex:1;margin:0}
.bs-input{display:flex;gap:14px;align-items:center;margin:18px 0}
.bs-field{flex:1;font:inherit;font-size:27px;font-weight:600;padding:13px 22px;border-radius:18px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
.bs-field:focus{border-color:var(--p2)}
.bs-count{font-size:22px;color:var(--muted);font-weight:800;white-space:nowrap}
.bs-board{position:relative;flex:1;min-height:0;border:3px dashed var(--line);border-radius:26px;background:rgba(255,255,255,.55);padding:20px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;overflow:hidden}
.bs-board:empty::before{content:'🧠 أفكار الطالبات ستظهر هنا…';position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:var(--muted);font-weight:700}
.sticky{font-size:27px;font-weight:800;padding:13px 22px;border-radius:14px;transform:rotate(var(--r));box-shadow:0 8px 18px -10px rgba(0,0,0,.35);animation:stickIn .45s both;cursor:pointer}
@keyframes stickIn{from{opacity:0;transform:scale(.4) rotate(var(--r))}}
.c0{background:#FFF1B8}.c1{background:#E3D7FF}.c2{background:#CFF5E7}.c3{background:#FFDCD6}.c4{background:#D5EFFF}

/* ---------- المؤقت ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.t-ring{position:relative;width:120px;height:120px}
.timer.compact .t-ring{width:92px;height:92px}
.t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:#fff;stroke:var(--line);stroke-width:9}
.tr-fg{fill:none;stroke:var(--p);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.warn .tr-fg,.timer.done .tr-fg{stroke:var(--coral)}
.t-num{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--pd);direction:ltr}
.timer.compact .t-num{font-size:25px}
.timer.warn .t-num{color:var(--coral);animation:pulse 1s infinite}
.t-btn{font-size:19px;font-weight:800;padding:7px 18px;border-radius:999px;background:var(--lav);color:var(--p);transition:.2s}
.t-btn:hover{background:var(--p);color:#fff}

/* ---------- شريحة ورقة العمل ---------- */
.ws-wrap{display:grid;grid-template-columns:1fr 470px;gap:40px;flex:1;min-height:0;align-items:center}
.ws-list{list-style:none;display:flex;flex-direction:column;gap:16px;margin:6px 0 22px}
.ws-list li{display:flex;align-items:center;gap:20px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px 24px;box-shadow:var(--shadow)}
.ws-n{flex:none;width:62px;height:62px;border-radius:18px;background:var(--p);color:#fff;font-size:32px;font-weight:900;display:grid;place-items:center}
.ws-list li:nth-child(2) .ws-n{background:var(--mint)}
.ws-list b{display:block;font-size:31px;color:var(--pd);font-weight:900}
.ws-list small{font-size:22px;color:var(--muted);font-weight:700}
.ws-roles{display:flex;flex-wrap:wrap;gap:12px}
.ws-roles span{background:var(--yelbg);border:2px solid var(--yelline);border-radius:999px;padding:8px 18px;font-size:22px;font-weight:800;color:var(--pd)}
.ws-timer{display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;border:3px solid var(--line);border-radius:36px;padding:30px 20px;box-shadow:var(--shadow)}
.ws-timer .timer{gap:18px}
.ws-timer .t-ring{width:330px;height:330px}
.ws-timer .t-num{font-size:92px}
.ws-timer .tr-bg{stroke-width:7}
.ws-timer .tr-fg{stroke-width:7;stroke:var(--mint)}
.ws-timer .timer.warn .tr-fg,.ws-timer .timer.done .tr-fg{stroke:var(--coral)}
.ws-timer .t-btn{font-size:28px;padding:12px 40px;background:var(--p);color:#fff}
.ws-timer .t-btn:hover{background:var(--pd)}
.ws-cap{font-size:24px;font-weight:800;color:var(--muted)}

/* ---------- التصنيف / صح وخطأ ---------- */
.sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;flex:1;min-height:0;align-content:start}
.sort-grid.one{grid-template-columns:1fr}
.srow{display:flex;align-items:center;flex-wrap:wrap;gap:14px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:11px 18px;transition:border-color .3s,background .3s}
.s-text{flex:1;min-width:0;display:flex;align-items:center;gap:12px;font-size:25px;font-weight:700;line-height:1.45}
.s-ico{font-size:34px;flex:none}
.s-btns{display:flex;gap:10px;flex:none}
.srow.solved{border-color:var(--mint);background:var(--mintbg)}
.srow .explain{flex-basis:100%;font-size:21px;padding:6px 14px}

/* ---------- فكر - زاوج - شارك ---------- */
.tps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;min-height:0}
.phase{background:#fff;border:3px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;cursor:pointer;transition:.3s;box-shadow:var(--shadow)}
.phase:hover{transform:translateY(-5px)}
.phase.active{border-color:var(--p);background:linear-gradient(180deg,#fff,var(--lav));transform:translateY(-6px) scale(1.02)}
.ph-ico{font-size:68px}
.ph-name{font-size:38px;font-weight:900;color:var(--pd)}
.ph-hint{font-size:22px;color:var(--muted);line-height:1.5;font-weight:600}
.ph-time{font-size:38px;font-weight:900;color:var(--p);background:var(--lav);padding:4px 26px;border-radius:999px;direction:ltr}
.ph-time.warn,.ph-time.done{color:var(--coral)}
.ph-tip{text-align:center;color:var(--muted);font-size:20px;font-weight:700;margin-top:12px}

/* ---------- أسئلة متعددة داخل شريحة ---------- */
.multi{display:flex;flex-direction:column;flex:1;min-height:0}
.m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:24px;font-weight:800;color:var(--muted)}
.m-top b{color:var(--p)}
.m-dots{display:flex;gap:8px}
.m-dots i{width:36px;height:10px;border-radius:9px;background:var(--line);transition:.3s}
.m-dots i.on{background:var(--p)}
.mq{display:none}
.mq.show{display:block;animation:rise .5s both}
.m-nav{display:flex;justify-content:center;gap:16px;margin-top:auto;direction:ltr}

/* ---------- محاكاة المتجر ---------- */
.shop-sim{display:grid;grid-template-columns:1fr 520px;gap:26px;flex:1;min-height:0}
.store,.cart{background:#fff;border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.store{padding:18px 24px}
.store-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.st-name{font-size:27px;font-weight:900;color:var(--pd);direction:ltr}
.st-sort{font:inherit;font-size:19px;font-weight:700;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--lav2);color:var(--ink);cursor:pointer}
.products{display:flex;gap:18px;flex:1;min-height:0}
.prod{position:relative;flex:1;border:2px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 12px 16px;transition:.3s;background:linear-gradient(180deg,var(--lav2),#fff)}
.prod:hover{transform:translateY(-4px);border-color:var(--p2)}
.p-img{font-size:92px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.12))}
.p-name{font-size:29px;font-weight:900}
.p-price{font-size:22px}
.p-price s{color:var(--muted);font-size:19px}
.p-price b{color:var(--p);font-size:27px}
.sale{position:absolute;top:12px;right:12px;background:var(--coral);color:#fff;font-size:17px;font-weight:800;padding:4px 12px;border-radius:999px}
.shop-tip{margin-top:12px;font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.shop-tip b{color:var(--p)}
.cart{padding:18px 22px;gap:12px}
.cart-head{font-size:27px;font-weight:900;color:var(--pd);display:flex;align-items:center;gap:10px}
.c-badge{background:var(--coral);color:#fff;font-size:18px;min-width:32px;height:32px;border-radius:999px;display:grid;place-items:center;padding:0 8px}
.cart-items{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:23px;font-weight:700;border:2px dashed var(--line);border-radius:18px;text-align:center;padding:10px}
.ci{display:flex;align-items:center;gap:12px;background:var(--lav2);border-radius:16px;padding:8px 12px;font-size:22px;animation:rise .35s both}
.ci-del{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--coral);font-weight:900;flex:none}
.ci-img{font-size:32px}
.ci-name{flex:1;font-weight:800}
.ci-qty{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:3px 6px}
.ci-qty button{width:30px;height:30px;border-radius:8px;background:var(--lav);color:var(--p);font-weight:900;font-size:20px}
.ci-sub{font-weight:800;color:var(--p);min-width:120px;text-align:left}
.coupon{display:flex;gap:10px}
.cp-field{flex:1;font:inherit;font-size:20px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);outline:none}
.cp-field:focus{border-color:var(--p2)}
.cart-total{display:flex;justify-content:space-between;align-items:center;font-size:25px;font-weight:900;border-top:2px dashed var(--line);padding-top:10px}
.ct-val{color:var(--p);font-size:29px}
.ct-val small{font-size:16px;color:var(--mint);background:var(--mintbg);padding:2px 8px;border-radius:8px}
.cart-msg{min-height:30px;font-size:21px;font-weight:800;color:var(--mint);text-align:center}

/* ---------- تحدي الترتيب ---------- */
.order-ch{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.oc-pool{display:flex;flex-direction:column;gap:12px}
.oc-item{font-size:25px;font-weight:800;padding:15px 22px;border-radius:18px;background:#fff;border:3px solid var(--line);text-align:right;transition:.25s;box-shadow:var(--shadow)}
.oc-item:hover:not(:disabled){border-color:var(--p2);transform:translateX(-6px)}
.oc-item:disabled{opacity:.55;cursor:not-allowed;filter:blur(2px)}
.oc-right{display:flex;flex-direction:column;gap:14px;min-height:0}
.oc-ctrl{display:flex;align-items:center;gap:22px}
.oc-btns{display:flex;flex-direction:column;gap:10px}
.oc-done{position:relative;list-style:none;flex:1;border:3px dashed var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.55)}
.oc-done:empty::before{content:'📦 اضغطي الخطوات بالترتيب الصحيح لتظهر هنا';position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:var(--muted);font-weight:700;padding:20px;text-align:center}
.oc-done li{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:800;background:var(--mintbg);border:2px solid var(--mint);border-radius:16px;padding:9px 16px;animation:rise .35s both}
.oc-n{width:38px;height:38px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;flex:none}
.oc-msg{font-size:27px;font-weight:900;color:var(--mint);text-align:center;min-height:38px}

/* ---------- الفاتورة (المراجعة) ---------- */
.invoice{position:relative;background:#fff;border-radius:28px;box-shadow:var(--shadow);border:3px solid var(--line);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.inv-head{display:flex;justify-content:space-between;background:linear-gradient(135deg,var(--p),var(--mint));color:#fff;padding:14px 30px;font-size:23px;font-weight:800}
.inv-rows{flex:1;display:flex;flex-direction:column;padding:4px 30px}
.inv-row{flex:1;display:flex;align-items:center;gap:20px;border-bottom:2px dashed var(--line);cursor:pointer;font-size:24px;padding:0 10px;border-radius:10px;transition:background .2s}
.inv-row:hover{background:var(--lav2)}
.ir-k{width:290px;flex:none;font-weight:900;color:var(--pd)}
.ir-v{flex:1;font-weight:700;opacity:0;transform:translateX(-14px);transition:.45s}
.ir-q{color:var(--muted);font-size:20px;font-weight:700;white-space:nowrap}
.inv-row.open .ir-v{opacity:1;transform:none}
.inv-row.open .ir-q{display:none}
.inv-total{display:flex;justify-content:space-between;padding:14px 30px;font-size:29px;font-weight:900;background:var(--yelbg);color:var(--pd)}

/* ---------- أهداف الدرس (إيصال) ---------- */
.receipt{background:#fff;border-radius:28px;box-shadow:var(--shadow);border:3px solid var(--line);padding:20px 40px;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1240px;margin:0 auto}
.rc-top{display:flex;justify-content:space-between;font-size:28px;font-weight:900;color:var(--mint);border-bottom:3px dashed var(--line);padding-bottom:12px;margin-bottom:4px}
.rc-top span:last-child{color:var(--muted);font-size:21px}
.receipt ul{list-style:none;flex:1;display:flex;flex-direction:column;justify-content:space-around}
.obj{display:flex;align-items:center;gap:20px;font-size:26px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:14px;transition:background .2s}
.obj:hover{background:var(--lav2)}
.chk{width:44px;height:44px;border-radius:12px;border:3px solid var(--line);display:grid;place-items:center;flex:none;transition:.3s}
.obj.open .chk{background:var(--mint);border-color:var(--mint)}
.obj.open .chk::after{content:'✓';color:#fff;font-weight:900;font-size:28px}

/* ---------- الشريحة الترحيبية ---------- */
.welcome{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:40px;flex:1}
.w-text h1{font-size:90px;font-weight:900;line-height:1.15;margin:20px 0 14px;background:linear-gradient(135deg,var(--pd),var(--p2) 55%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.w-sub{font-size:33px;color:var(--muted);font-weight:600;line-height:1.5}
.w-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.w-meta span{background:#fff;border:2px solid var(--line);padding:10px 20px;border-radius:999px;font-size:23px;font-weight:700}
.w-note{margin-top:22px;font-size:23px;color:var(--p);font-weight:700}
.w-art{position:relative;display:flex;justify-content:center}
.shopf{width:470px;filter:drop-shadow(0 30px 40px rgba(76,40,160,.25))}
.shop-sign{background:var(--mint);color:#fff;font-weight:900;font-size:27px;padding:10px 26px;border-radius:14px;width:max-content;margin:0 auto 12px}
.awning{position:relative;height:84px;border-radius:22px 22px 0 0;background:repeating-linear-gradient(90deg,var(--p) 0 58px,var(--yel) 58px 116px)}
.awning::after{content:'';position:absolute;left:0;right:0;bottom:-28px;height:29px;
  background:radial-gradient(circle at 29px 0,var(--p) 28px,transparent 29px) 0 0/116px 29px repeat-x,
             radial-gradient(circle at 87px 0,var(--yel) 28px,transparent 29px) 0 0/116px 29px repeat-x}
.shop-body{background:#F6F1FF;border:4px solid var(--line);border-top:0;border-radius:0 0 24px 24px;padding:50px 28px 0;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;height:320px}
.shop-window{align-self:start;background:linear-gradient(160deg,#E6F6FF,#F1EAFF);border:4px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:space-around;font-size:54px;height:160px}
.shop-window span{animation:bob 3s ease-in-out infinite}
.shop-window span:nth-child(2){animation-delay:.4s}
.shop-window span:nth-child(3){animation-delay:.8s}
.shop-door{align-self:end;background:#fff;border:4px solid var(--line);border-bottom:0;border-radius:70px 70px 0 0;height:230px;display:flex;justify-content:center;padding-top:34px}
.shop-door span{height:max-content;background:var(--mintbg);color:#0b7a58;font-weight:900;font-size:21px;padding:6px 16px;border-radius:999px}
.float-cart{position:absolute;bottom:-34px;left:-10px;font-size:104px;animation:drive 4s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(34px) rotate(-5deg)}}

/* ---------- الشريحة الختامية ---------- */
.closing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.cl-ico{font-size:104px;animation:bob 3s ease-in-out infinite}
.closing h1{font-size:74px;font-weight:900;color:var(--pd)}
.cl-score{font-size:31px;font-weight:800;background:#fff;border:3px solid var(--line);padding:10px 30px;border-radius:999px;box-shadow:var(--shadow)}
.cl-score b{color:var(--mint);font-size:40px}
.hw{font-size:25px;max-width:1150px;background:#FFF7E6;border-right:6px solid var(--amber);padding:14px 26px;border-radius:18px;line-height:1.6;text-align:right;font-weight:600}

/* =========================================================
   4) شريط التحكم + التلميح + التأثيرات
   ========================================================= */
#controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);padding:7px;border-radius:999px;box-shadow:0 18px 40px -16px rgba(60,30,130,.5);z-index:40;transition:opacity .4s,transform .4s;font-size:clamp(14px,1.15vw,18px)}
.cb{padding:9px 18px;border-radius:999px;font-weight:800;color:var(--pd);font-size:inherit;transition:background .2s,transform .15s}
.cb:hover{background:var(--lav)}
.cb:active{transform:scale(.92)}
.cb:disabled{opacity:.35;cursor:default}
.cb.primary{background:var(--p);color:#fff}
.cb.clap{background:var(--yelbg)}
.cb.primary:hover{background:var(--pd)}
.cb.clap{font-size:1.55em;padding:3px 14px;line-height:1.2}
.cb-num{font-weight:900;color:var(--muted);padding:0 8px;min-width:72px;text-align:center}
.cb-num b{color:var(--p)}
.cb-sep{width:1px;height:26px;background:var(--line)}
body.idle #controls{opacity:0;transform:translate(-50%,26px);pointer-events:none}
body.idle{cursor:none}
#hint{position:fixed;bottom:14px;right:16px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.8);padding:6px 12px;border-radius:999px;z-index:39;transition:opacity .4s}
body.idle #hint{opacity:.3}
kbd{font-family:inherit;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-weight:900;color:var(--pd)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);opacity:0;background:var(--pd);color:#fff;font-size:clamp(18px,2vw,30px);font-weight:900;padding:12px 32px;border-radius:999px;z-index:60;transition:.35s;pointer-events:none;box-shadow:0 18px 40px -14px rgba(60,30,130,.6);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--mint)}
#toast.no{background:var(--p)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fx-clap{position:absolute;bottom:40px;line-height:1}
.fx-conf{position:absolute;width:12px;height:16px;border-radius:3px;margin:-8px 0 0 -6px}
</style>
</head>
<body>

<div id="viewport">

<script>
/* ==================================================================
   ✏️ إعدادات الدرس — عدّلي هنا فقط بدون الحاجة لمعرفة البرمجة
   ================================================================== */
const LESSON = {
  title:   'مقدمة في التجارة الإلكترونية',
  lessonNo:'الدرس الأول',
  subject: 'المهارات الرقمية',

  brand:   'متجر الدرس',

};

/* ------------------------------------------------------------------
   الشرائح — كل عنصر {} هو شريحة. أنواع الشرائح المتاحة:
   welcome | flip | mcq | objectives | steps | discover | brainstorm
   cards | sort | tps | multi | shop | order | invoice | closing
   fx = نوع الانتقال: 'fade' أو 'slide' أو 'zoom'
   answer = رقم الإجابة الصحيحة (يبدأ العد من 0)
   ------------------------------------------------------------------ */
const SLIDES = [

  /* 1) ترحيب */
  { type:'welcome', fx:'zoom',

    note:'🎧 تأكدي من الصوت وجهّزي الدردشة 💬 للمشاركة' },

  /* 2) مراجعة قواعد البيانات في أكسس — بطاقات تُقلب */
  { type:'flip', fx:'slide', strategy:'🔁 مراجعة | استراتيجية الأسئلة', title:'تذكرين أكسس؟ اقلبي البطاقة!', cols:3,
    cards:[
      {icon:'🗄️', front:'قاعدة البيانات', back:'مجموعة منظّمة من البيانات المترابطة يسهل حفظها والبحث فيها.'},
      {icon:'📋', front:'الجدول', back:'يخزّن البيانات في صفوف وأعمدة.'},
      {icon:'🔤', front:'الحقل', back:'عمود يمثّل نوعًا واحدًا من البيانات.', example:'مثل: السعر، الاسم'},

/* ---------- الأصوات (Web Audio API — بدون ملفات خارجية) ---------- */
const Sound = (() => {
  let ac = null, master = null, nb = null;
  function ctx(){
    try{
      if(!ac){
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createDynamicsCompressor();
        master.connect(ac.destination);
      }
      if(ac.state === 'suspended') ac.resume();
    }catch(e){ return null; }
    return ac;
  }
  function tone(f, t, d, type='sine', vol=.18, f2){
    const a = ctx(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+d+0.05);
  }
  function noise(a){
    if(nb) return nb;
    const len = Math.floor(a.sampleRate*0.4);
    nb = a.createBuffer(1, len, a.sampleRate);
    const d = nb.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return nb;
  }
  // ضربة تصفيق واحدة = ضوضاء مرشّحة بغلاف سريع
  function clapHit(a, t, vol){
    const s = a.createBufferSource(); s.buffer = noise(a);
    const bp = a.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 900 + Math.random()*1500; bp.Q.value = .7 + Math.random()*.6;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.004);
    g.gain.exponentialRampToValueAtTime(vol*0.25, t+0.012);
    g.gain.exponentialRampToValueAtTime(vol*0.8, t+0.017);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.13+Math.random()*0.06);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t, Math.random()*0.15, 0.22);
  }
  return {
    clap(){ // تصفيق جماعي قصير (~ ثانيتان)
      const a = ctx(); if(!a) return;
      const t0 = a.currentTime + 0.03, dur = 2.0;
      for(let p=0;p<8;p++){
        let t = t0 + Math.random()*0.2;
        const gap = 0.12 + Math.random()*0.07;
        while(t < t0+dur){
          const fade = 1 - (t-t0)/dur;
          clapHit(a, t, (0.12+Math.random()*0.12)*(0.3+0.7*fade));
          t += gap*(0.85+Math.random()*0.3);
        }
      }
    },
    success(){ const a=ctx(); if(!a) return; const t=a.currentTime;
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.09,0.35,'triangle',0.2));
      tone(1318.5,t+0.36,0.5,'sine',0.12); },
    wrong(){ const a=ctx(); if(!a) return; const t=a.currentTime;
      tone(392,t,0.18,'sine',0.16); tone(311,t+0.16,0.32,'sine',0.16); },
    pop(){ const a=ctx(); if(!a) return; tone(620,a.currentTime,0.12,'sine',0.14,980); },
    flip(){ const a=ctx(); if(!a) return; tone(380,a.currentTime,0.16,'triangle',0.1,760); },
    bell(){ const a=ctx(); if(!a) return; const t=a.currentTime;
      [0,0.4].forEach(o=>{ tone(880,t+o,0.9,'sine',0.22); tone(1760,t+o,0.6,'sine',0.06); }); }
  };
})();

const fx = $('#fx');

function clapFX(){
  for(let i=0;i<16;i++){
    const s = document.createElement('span');

    s.style.left = (8 + Math.random()*84) + 'vw';

      {transform:'translate(0,0) scale(.6)', opacity:0},
      {opacity:1, offset:.15},
      {transform:`translate(${dx}px,-${dy}vh) scale(1.1) rotate(${rot}deg)`, opacity:0}
    ], {duration:1600+Math.random()*900, delay:Math.random()*350, easing:'cubic-bezier(.2,.7,.3,1)', fill:'both'})
     .onfinish = () => s.remove();
  }
}
function clap(){
  Sound.clap(); clapFX();
  const b = $('.cb.clap');
  b && b.animate([{transform:'scale(1)'},{transform:'scale(1.35) rotate(-10deg)'},{transform:'scale(1)'}],{duration:450});
}
function burst(x, y, n=36){
  for(let i=0;i<n;i++){
    const p = document.createElement('i');
    p.className = 'fx-conf';
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = COLORS[i % COLORS.length];
    fx.appendChild(p);
    const a = Math.random()*Math.PI*2, v = 120 + Math.random()*230;
    const dx = Math.cos(a)*v, dy = Math.sin(a)*v - 120;
    p.animate([
      {transform:'translate(0,0) rotate(0)', opacity:1},
      {transform:`translate(${dx}px,${dy+260}px) rotate(${Math.random()*720}deg)`, opacity:0}
    ], {duration:1100+Math.random()*600, easing:'cubic-bezier(.15,.6,.35,1)'}).onfinish = () => p.remove();
  }
}
function burstFrom(el){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2); }
function rain(){
  for(let i=0;i<90;i++){

const CIRC = 2*Math.PI*44;
const tState = el => el._t || (el._t = {total:+el.dataset.sec, left:+el.dataset.sec, id:null, onEnd:null});
function tBtn(el, txt){ const b = $('.t-btn', el); if(b) b.textContent = txt; }
function tDraw(el){
  const st = tState(el);
  ( $('.t-num', el) || el ).textContent = fmt(Math.max(0, st.left));
  const r = $('.tr-fg', el); if(r) r.style.strokeDashoffset = CIRC*(1 - st.left/st.total);
  el.classList.toggle('warn', !!st.id && st.left <= 10 && st.left > 0);
}
function tStart(el, onEnd){
  const st = tState(el); if(st.id) return;
  if(onEnd) st.onEnd = onEnd;
  if(st.left <= 0) st.left = st.total;
  el.classList.remove('done'); tBtn(el, '⏸ إيقاف');
  st.id = setInterval(() => {
    st.left--; tDraw(el);
    if(st.left <= 0){
      clearInterval(st.id); st.id = null;
      el.classList.remove('warn'); el.classList.add('done'); tBtn(el, '↺ إعادة');
      Sound.bell(); st.onEnd && st.onEnd();
      if(el.dataset.end){ toast(el.dataset.end, 'ok'); clapFX(); }
    }
  }, 1000);
  tDraw(el);
}
function tStop(el){ const st = tState(el); if(st.id){ clearInterval(st.id); st.id = null; tBtn(el, '▶ متابعة'); } el.classList.remove('warn'); }
function tReset(el){ tStop(el); const st = tState(el); st.left = st.total; el.classList.remove('done'); tBtn(el, '▶ ابدئي'); tDraw(el); }
function tToggle(el){ tState(el).id ? tStop(el) : tStart(el); }

/* تهيئة إضافية لبعض الأنواع بعد إنشائها */
const INIT = {
  shop:  el => renderCart(el),
  order: el => renderPool(el)
};

/* ---------- بناء الشرائح ---------- */
$('#brandName').textContent = LESSON.brand;
$('#brandSub').textContent  = LESSON.lessonNo + ' • ' + LESSON.grade;
const host = $('#slides');
SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide t-' + s.type;
  el.dataset.i = i;
  el.innerHTML = R[s.type](s, i);
  host.appendChild(el);
  INIT[s.type] && INIT[s.type](el, s);
});
const els = $$('.slide', host);
$('#total').textContent = SLIDES.length;

/* ---------- التنقل ---------- */
let cur = 0;
function play(el){
  $$('.rv', el).forEach((it, k) => it.style.animationDelay = (120 + Math.min(k,14)*80) + 'ms');
  el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
}
function stopTimersIn(el){
  $$('.timer, .ph-time[data-sec]', el).forEach(t => { if(t._t && t._t.id) tStop(t); });
}
function go(n){
  if(n < 0 || n >= SLIDES.length || n === cur) return;
  const dir = n > cur ? 1 : -1;
  const from = els[cur], to = els[n];
  stopTimersIn(from);
  from.classList.remove('active','play','fx-fade','fx-slide-n','fx-slide-p','fx-zoom');
  from.classList.add('out');
  clearTimeout(from._o); from._o = setTimeout(() => from.classList.remove('out'), 400);
  const f = SLIDES[n].fx || 'slide';
  to.classList.remove('out');
  to.classList.add('active', f === 'slide' ? (dir > 0 ? 'fx-slide-n' : 'fx-slide-p') : 'fx-' + f);
  play(to);
  cur = n; updateUI();
}
const next = () => go(cur + 1);
const prev = () => go(cur - 1);
function updateUI(){
  const last = SLIDES.length - 1;
  $('#num').textContent = cur + 1;
  $('#btnPrev').disabled = cur === 0;
  $('#btnNext').disabled = cur === last;
  const p = last ? cur / last : 1;
  $('#trackFill').style.width = `calc((100% - 120px) * ${p})`;
  const stage = cur === last ? 3 : Math.floor(p * 3 + 1e-9);
  $$('.tk').forEach((t, k) => t.classList.toggle('on', k <= stage));
  try{ history.replaceState(null, '', '#' + (cur + 1)); }catch(e){}
}

/* ---------- الإجابة على الأسئلة (موحّدة لكل الأنواع) ---------- */
function answer(btn){
  const g = btn.closest('.qgroup');
  if(!g || g.classList.contains('solved') || btn.disabled) return;
  const fb = $('.fb', g);
  if(btn.dataset.ok === '1'){
    g.classList.add('solved'); btn.classList.add('ok');
    $$('.opt', g).forEach(b => b.disabled = true);
    Sound.success(); burstFrom(btn);
    const msg = 'أحسنتِ! 👏 إجابة صحيحة';
    if(fb){ fb.className = 'fb ok'; fb.textContent = msg; popEl(fb); } else toast(msg, 'ok');
    addPoint(g.dataset.qid);
  } else {
    btn.classList.add('no'); btn.disabled = true; shake(btn); Sound.wrong();
    const msg = 'حاولي مرة أخرى 💜';
    if(fb){ fb.className = 'fb no'; fb.textContent = msg; popEl(fb); } else toast(msg, 'no');
  }
}

/* ---------- الخطوات المتتابعة ---------- */
function stepNext(slide){
  const items = $$('.tstep', slide);
  const nx = items.find(x => !x.classList.contains('on'));
  if(!nx) return;
  nx.classList.add('on'); Sound.pop();
  if(!items.some(x => !x.classList.contains('on'))){
    const f = $('.final', slide);
    if(f){ f.classList.add('show'); Sound.success(); setTimeout(() => burstFrom(f), 150); }
  }
}
function stepReset(slide){
  $$('.tstep', slide).forEach(x => x.classList.remove('on'));
  const f = $('.final', slide); f && f.classList.remove('show');
}

/* ---------- العصف الذهني ---------- */
function addIdea(slide){
  const inp = $('.bs-field', slide), v = inp.value.trim();
  if(!v) return;
  const board = $('.bs-board', slide);
  const n = document.createElement('div');
  n.className = 'sticky c' + (board.children.length % 5);
  n.style.setProperty('--r', (Math.random()*8 - 4).toFixed(1) + 'deg');
  n.textContent = v; n.title = 'اضغطي مرتين للحذف';
  n.addEventListener('dblclick', () => { n.remove(); countIdeas(slide); });
  board.appendChild(n);
  inp.value = ''; inp.focus();
  countIdeas(slide); Sound.pop();
}
function countIdeas(slide){ $('.bs-count', slide).textContent = $('.bs-board', slide).children.length + ' فكرة'; }

/* ---------- فكر زاوج شارك ---------- */
function phase(ph, slide){
  $$('.phase', slide).forEach(p => {
    if(p !== ph){ p.classList.remove('active'); const t = $('.ph-time[data-sec]', p); if(t && t._t && t._t.id) tStop(t); }
  });
  ph.classList.add('active'); Sound.pop();
  const t = $('.ph-time[data-sec]', ph);
  if(t) tToggle(t);
}

/* ---------- أسئلة متعددة داخل شريحة ---------- */
function multiNav(slide, d){
  const w = $('.multi', slide), qs = $$('.mq', w);
  const c = +w.dataset.cur + d;
  if(c < 0 || c >= qs.length) return;
  qs.forEach((q, k) => q.classList.toggle('show', k === c));
  w.dataset.cur = c;
  $('.m-top b', w).textContent = c + 1;
  $$('.m-dots i', w).forEach((dot, k) => dot.classList.toggle('on', k <= c));
  Sound.pop();
}

/* ---------- محاكاة المتجر ---------- */
function cartOf(slide){ return slide._cart || (slide._cart = {items:{}, disc:0}); }
function renderCart(slide){
  const s = SLIDES[+slide.dataset.i], c = cartOf(slide), box = $('.cart-items', slide);
  const keys = Object.keys(c.items).filter(k => c.items[k] > 0);
  box.innerHTML = keys.length ? keys.map(k => {
    const p = s.products[k], q = c.items[k];
    return `<div class="ci"><button class="ci-del" data-act="shop-del" data-k="${k}" title="حذف">✕</button><span class="ci-img">${p.emoji}</span><span class="ci-name">${p.name}</span><span class="ci-qty"><button data-act="shop-dec" data-k="${k}">−</button><b>${q}</b><button data-act="shop-inc" data-k="${k}">+</button></span><span class="ci-sub">${money(p.price*q)}</span></div>`;
  }).join('') : '<div class="empty">السلة فارغة… أضيفي منتجًا! 🛍️</div>';
  let total = keys.reduce((a, k) => a + s.products[k].price * c.items[k], 0);
  if(c.disc) total *= (1 - c.disc);
  $('.ct-val', slide).innerHTML = (c.disc ? `<small>خصم ${Math.round(c.disc*100)}%</small> ` : '') + money(total);
  $('.c-badge', slide).textContent = keys.reduce((a, k) => a + c.items[k], 0);
}
function shopAct(act, slide, k){
  const s = SLIDES[+slide.dataset.i], c = cartOf(slide);
  if(act === 'shop-add' || act === 'shop-inc'){ c.items[k] = (c.items[k]||0) + 1; Sound.pop(); if(act==='shop-add') toast(`أُضيف «${s.products[k].name}» إلى السلة 🛒`, 'ok'); $('.c-badge', slide).animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:350}); }
  if(act === 'shop-dec'){ c.items[k] = Math.max(0, (c.items[k]||0) - 1); Sound.pop(); }
  if(act === 'shop-del'){ delete c.items[k]; Sound.flip(); }
  if(act === 'shop-coupon'){
    const f = $('.cp-field', slide);
    if(s.coupon && f.value.trim() === s.coupon.code){ c.disc = s.coupon.discount; Sound.success(); toast('تم تطبيق القسيمة 🎟️', 'ok'); }
    else { Sound.wrong(); shake(f); toast('رمز القسيمة غير صحيح 💜', 'no'); }
  }
  if(act === 'shop-checkout'){
    const count = Object.values(c.items).reduce((a, b) => a + b, 0);
    const msg = $('.cart-msg', slide);
    if(!count){ Sound.wrong(); toast('السلة فارغة! أضيفي منتجًا أولًا 🛍️', 'no'); return; }
    const no = Math.floor(10000 + Math.random()*89999);
    msg.textContent = `✅ تم استلام طلبك رقم #${no} — ستصلك رسالة تأكيد 📧`; popEl(msg);
    c.items = {}; c.disc = 0; $('.cp-field', slide).value = '';
    Sound.success(); rain(); addPoint('shop');
  }
  renderCart(slide);
}

/* ---------- تحدي الترتيب ---------- */
function ocOf(slide){ return slide._oc || (slide._oc = {next:0, started:false, t0:0}); }
function renderPool(slide){
  const s = SLIDES[+slide.dataset.i];
  const idx = s.steps.map((_, k) => k);
  let order = shuffle(idx);
  while(order.every((v, k) => v === k) && idx.length > 1) order = shuffle(idx);
  $('.oc-pool', slide).innerHTML = order.map(k => `<button class="oc-item" data-act="oc-pick" data-k="${k}" disabled>${s.steps[k]}</button>`).join('');
}
function ocStart(slide){
  const st = ocOf(slide); if(st.started) return;
  Object.assign(st, {next:0, started:true, t0:Date.now()});
  $$('.oc-item', slide).forEach(b => b.disabled = false);
  $('[data-act="oc-start"]', slide).disabled = true;
  const tm = $('.timer', slide);
  tReset(tm);
  tStart(tm, () => {
    const total = SLIDES[+slide.dataset.i].steps.length;
    if(st.next < total){
      st.started = false;
      $$('.oc-item', slide).forEach(b => b.disabled = true);
      $('.oc-msg', slide).textContent = 'انتهى الوقت ⏰ لنرتّبها معًا!';
      $('.oc-msg', slide).style.color = 'var(--coral)';
    }
  });
  Sound.pop();
}
function ocPick(btn, slide){
  const st = ocOf(slide); if(!st.started) return;
  const s = SLIDES[+slide.dataset.i], k = +btn.dataset.k;
  if(k === st.next){
    const li = document.createElement('li');
    li.innerHTML = `<span class="oc-n">${k+1}</span><span>${s.steps[k]}</span>`;
    $('.oc-done', slide).appendChild(li);
    btn.remove(); st.next++; Sound.pop();
    if(st.next === s.steps.length){
      st.started = false;
      tStop($('.timer', slide));
      const sec = Math.round((Date.now() - st.t0) / 1000);
      const m = $('.oc-msg', slide);
      m.style.color = ''; m.textContent = `🏆 أحسنتِ! رتّبتِ الخطوات في ${sec} ثانية`; popEl(m);
      Sound.success(); rain(); addPoint('order');
    }
  } else {
    shake(btn); Sound.wrong(); toast('حاولي مرة أخرى 💜', 'no');
  }
}
function ocReset(slide){
  const st = ocOf(slide); Object.assign(st, {next:0, started:false});
  tReset($('.timer', slide));
  $('.oc-done', slide).innerHTML = '';
  $('.oc-msg', slide).textContent = '';
  $('[data-act="oc-start"]', slide).disabled = false;
  renderPool(slide); Sound.flip();
}

/* ---------- ملء الشاشة ---------- */
function toggleFS(){
  const d = document, e = d.documentElement;
  if(!d.fullscreenElement && !d.webkitFullscreenElement){ (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e); }
  else { (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); }
}

/* ---------- النقرات (تفويض الأحداث) ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, slide = t.closest('.slide');
  if(t.tagName === 'BUTTON') t.blur();
  switch(act){
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'clap': clap(); break;
    case 'fs': toggleFS(); break;
    case 'flip': t.classList.toggle('flipped'); Sound.flip(); break;
    case 'reveal': if(t.classList.toggle('open')) Sound.pop(); break;
    case 'opt': answer(t); break;
    case 'step-next': stepNext(slide); break;
    case 'step-reset': stepReset(slide); Sound.flip(); break;
    case 'timer': tToggle(t.closest('.timer')); Sound.pop(); break;
    case 'timer-reset': tReset($('.timer', slide)); Sound.flip(); break;
    case 'bs-add': addIdea(slide); break;
    case 'bs-clear': $('.bs-board', slide).innerHTML = ''; countIdeas(slide); Sound.flip(); break;
    case 'phase': phase(t, slide); break;
    case 'm-next': multiNav(slide, 1); break;
    case 'm-prev': multiNav(slide, -1); break;
    case 'shop-add': case 'shop-inc': case 'shop-dec': case 'shop-del':
    case 'shop-coupon': case 'shop-checkout': shopAct(act, slide, t.dataset.k); break;
    case 'oc-start': ocStart(slide); break;
    case 'oc-pick': ocPick(t, slide); break;
    case 'oc-reset': ocReset(slide); break;
  }
});

/* ترتيب المنتجات في المتجر */
document.addEventListener('change', e => {
  if(!e.target.classList.contains('st-sort')) return;
  const slide = e.target.closest('.slide'), mode = e.target.value;
  $$('.prod', slide).forEach(p => {
    const price = Math.round(+p.dataset.price * 100);
    p.style.order = mode === 'def' ? p.dataset.k : mode === 'asc' ? price : -price;
  });
  e.target.blur(); Sound.pop();
});

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
    const slide = e.target.closest('.slide');
    if(e.key === 'Enter' && e.target.classList.contains('bs-field')){ e.preventDefault(); addIdea(slide); }
    else if(e.key === 'Enter' && e.target.classList.contains('cp-field')){ e.preventDefault(); shopAct('shop-coupon', slide); }
    else if(e.key === 'Escape'){ e.target.blur(); }
    // إذا كان الحقل فارغًا تعمل الأسهم للتنقل
    else if(tag === 'INPUT' && !e.target.value && ['ArrowRight','ArrowLeft','PageDown','PageUp'].includes(e.key)){
      e.preventDefault(); e.target.blur();
      (e.key === 'ArrowRight' || e.key === 'PageDown') ? next() : prev();
    }
    return;
  }
  if(e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space' || e.key === 'PageDown'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace'){ e.preventDefault(); prev(); }
  else if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); }
  else if(e.key === 'ت' || e.code === 'KeyF'){ e.preventDefault(); if(!e.repeat) clap(); }
  else if(e.key === 'Home'){ e.preventDefault(); go(0); }
  else if(e.key === 'End'){ e.preventDefault(); go(SLIDES.length - 1); }
}, {passive:false});
document.addEventListener('keyup', e => { if(e.code === 'Space' && e.target.tagName === 'BUTTON') e.preventDefault(); });

/* ---------- إخفاء شريط التحكم تلقائيًا ---------- */
const controls = $('#controls');
let idleT;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if(!controls.matches(':hover')) document.body.classList.add('idle'); }, 2600);
}
['mousemove','mousedown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive:true}));

/* ---------- ملاءمة المسرح للشاشة (16:9 بدون تمرير) ---------- */
const stage = $('#stage');
function fit(){ stage.style.transform = `scale(${Math.min(innerWidth/1600, innerHeight/900)})`; }
addEventListener('resize', fit);
fit();

/* ---------- البدء ---------- */
(function start(){
  const h = parseInt((location.hash || '').slice(1), 10);
  cur = (h >= 1 && h <= SLIDES.length) ? h - 1 : 0;
  els[cur].classList.add('active', 'fx-zoom');
  play(els[cur]);
  updateUI(); wake();
})();
</script>
